name: Regression Gate

on:
  push:
    branches:
      - feature/home-v1-requirements
  pull_request:
    branches:
      - feature/home-v1-requirements
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Node 24 regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .github/cache-version
      - name: Refresh lockfile for this audit branch
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "ci(lockfile): sincroniza dependências da auditoria 02"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install dependencies from generated lockfile
        run: pnpm install --frozen-lockfile
      - name: Run full regression suite
        run: pnpm test
      - name: Validate production build
        run: pnpm build
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run runtime smoke
        run: pnpm smoke
        env:
          SMOKE_BROWSERS: chromium,firefox,webkit
