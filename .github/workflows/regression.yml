name: Regression Gate

on:
  push:
    branches:
      - feature/home-v1-requirements
  pull_request:
    branches:
      - feature/home-v1-requirements
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Node 24 regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --allow-build=esbuild
      - name: Run full regression suite
        run: pnpm test
      - name: Validate production build
        run: pnpm build
