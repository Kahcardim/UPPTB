name: Refresh pnpm lockfile artifact

on:
  push:
    branches:
      - qa/auditoria-02-fixes

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
