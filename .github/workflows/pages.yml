name: Deploy UPPTB preview to GitHub Pages

on:
  push:
    branches:
      - feature/home-v1-requirements
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static preview
        run: |
          mkdir -p _site
          cp -R public/. _site/
          mkdir -p _site/docs
          cp docs/UPPTB-Arquivo-Proibido-Turtle.md _site/docs/
          cp docs/benchmark-gate-1.md _site/docs/
          cp docs/escopo-gate-2.md _site/docs/
          cp docs/UPPTB-escopo-e-banco-de-frases.docx _site/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
